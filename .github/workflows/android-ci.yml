name: Android CI Build & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Platform & Build Tools
      run: |
        sdkmanager --install "platforms;android-35"
        sdkmanager --install "build-tools;35.0.0"

    - name: Generate Release Keystore
      run: |
        cd app
        keytool -genkeypair -v \
          -keystore release.keystore \
          -alias release \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass android \
          -keypass android \
          -dname "CN=Dice3D, OU=Dev, O=Dice3D, L=Shanghai, ST=Shanghai, C=CN"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Build Release APK
      run: gradle assembleRelease --stacktrace

    - name: List APK outputs
      run: find app/build/outputs/apk -name "*.apk" || echo "No APK files found"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-apk
        path: release/

    - uses: actions/download-artifact@v4
      with:
        name: debug-apk
        path: debug/

    - name: List downloaded files
      run: ls -la release/ debug/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Release v1.0.0 Build #${{ github.run_number }}
        body: |
          3D 物理骰子应用 - 自动构建版本

          构建编号: ${{ github.run_number }}
          提交: ${{ github.sha }}
        files: |
          release/*.apk
          debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
